{% extends "base.html" %}
{% block content %}
<style>
  #chat-log { display: flex; flex-direction: column; gap: 1rem; margin-bottom: 1.5rem; min-height: 12rem; }
  .msg { padding: 0.75rem 1rem; border-radius: 0.75rem; max-width: 90%; }
  .msg.bot { background: #f0f4f8; align-self: flex-start; }
  .msg.user { background: #2563eb; color: #fff; align-self: flex-end; }
  .msg.escalation { background: #fef3c7; border: 1px solid #f59e0b; align-self: stretch; }
  .options { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.75rem; }
  .options button, #chat-form button[type=submit] {
    padding: 0.5rem 0.85rem; border-radius: 0.5rem; border: 1px solid #cbd5e1;
    background: #fff; cursor: pointer; font-size: 0.95rem;
  }
  .options button:hover, #chat-form button[type=submit]:hover { background: #eff6ff; border-color: #2563eb; }
  #chat-form { display: flex; gap: 0.5rem; margin-top: 1rem; }
  #chat-form input[type=text] { flex: 1; padding: 0.6rem 0.75rem; border: 1px solid #cbd5e1; border-radius: 0.5rem; }
  #chat-form button[type=submit] { background: #2563eb; color: #fff; border-color: #2563eb; }
  .hidden { display: none; }
</style>

<div id="chat-app" data-session="{{ session_id | default('') }}">
  <div id="chat-log">
    {% if initial_say %}
    <div class="msg bot">{{ initial_say }}</div>
    {% endif %}
  </div>

  <div id="options-area" class="options"></div>

  <form id="chat-form"
        hx-post="/api/chat"
        hx-swap="none"
        hx-ext="json-enc"
        hx-headers='{"Accept": "application/json"}'
        hx-on::after-request="handleChatResponse(event)">
    <input type="hidden" name="session_id" id="session-id" value="{{ session_id | default('') }}">
    <input type="text" name="text" id="user-text" placeholder="Type your answer…" autocomplete="off" required>
    <button type="submit">Send</button>
  </form>

  <form id="confirm-form" class="hidden">
    <input type="hidden" name="session_id" id="confirm-session-id" value="{{ session_id | default('') }}">
    <button type="submit" id="confirm-btn">Confirm profile &amp; search</button>
    <p id="confirm-status" class="hidden" style="color:#64748b;font-size:0.9rem;">Searching nearby churches…</p>
  </form>
</div>

<script>
(function () {
  const log = document.getElementById('chat-log');
  const optionsArea = document.getElementById('options-area');
  const userText = document.getElementById('user-text');
  const sessionInput = document.getElementById('session-id');
  const confirmSession = document.getElementById('confirm-session-id');
  const confirmForm = document.getElementById('confirm-form');
  const chatForm = document.getElementById('chat-form');

  function appendUser(text) {
    const el = document.createElement('div');
    el.className = 'msg user';
    el.textContent = text;
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
  }

  function renderOptions(options) {
    optionsArea.innerHTML = '';
    if (!options || !options.length) return;
    options.forEach(function (opt) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = opt;
      btn.addEventListener('click', function () {
        userText.value = opt;
        appendUser(opt);
        chatForm.requestSubmit();
      });
      optionsArea.appendChild(btn);
    });
  }

  window.handleChatResponse = function (event) {
    if (!event.detail.successful) return;
    let data;
    try {
      data = JSON.parse(event.detail.xhr.responseText);
    } catch (e) {
      return;
    }
    if (data.session_id) {
      sessionInput.value = data.session_id;
      confirmSession.value = data.session_id;
    }
    const bot = document.createElement('div');
    bot.className = 'msg bot' + (data.escalation ? ' escalation' : '');
    bot.textContent = data.say || '';
    log.appendChild(bot);
    log.scrollTop = log.scrollHeight;

    renderOptions(data.options);

    // Read-back options include confirm — also show the confirm button
    const opts = data.options || [];
    const looksLikeReadback = opts.some(function (o) {
      return /that's right|change something/i.test(o);
    });
    if ((data.done || looksLikeReadback) && !data.escalation) {
      confirmForm.classList.remove('hidden');
    }
    if (data.done && !data.escalation) {
      chatForm.classList.add('hidden');
    }
    if (data.escalation) {
      chatForm.classList.add('hidden');
      optionsArea.innerHTML = '';
    }
    userText.value = '';
  };

  confirmForm.addEventListener('submit', function (ev) {
    ev.preventDefault();
    const sid = confirmSession.value || sessionInput.value;
    const status = document.getElementById('confirm-status');
    const btn = document.getElementById('confirm-btn');
    btn.disabled = true;
    status.classList.remove('hidden');
    fetch('/api/profile/confirm', {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'Accept': 'application/json'},
      body: JSON.stringify({session_id: sid})
    })
    .then(function (r) { return r.json(); })
    .then(function () {
      return fetch('/api/search', {
        method: 'POST',
        headers: {'Content-Type': 'application/json', 'Accept': 'application/json'},
        body: JSON.stringify({session_id: sid})
      });
    })
    .then(function (r) { return r.json(); })
    .then(function () {
      window.location.href = '/results/' + sid;
    })
    .catch(function () {
      status.textContent = 'Search failed — check API keys / try again.';
      btn.disabled = false;
    });
  });

  {% if not initial_say %}
  fetch('/api/chat', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({session_id: sessionInput.value || null, text: null})
  })
  .then(function (r) { return r.json(); })
  .then(function (data) {
    if (data.session_id) {
      sessionInput.value = data.session_id;
      confirmSession.value = data.session_id;
    }
    const bot = document.createElement('div');
    bot.className = 'msg bot';
    bot.textContent = data.say || '';
    log.appendChild(bot);
    renderOptions(data.options);
  })
  .catch(function () {
    const bot = document.createElement('div');
    bot.className = 'msg bot';
    bot.textContent = 'Start by telling us where you would be coming from and how far you would drive on a Sunday.';
    log.appendChild(bot);
  });
  {% else %}
  renderOptions({{ initial_options | default([]) | tojson }});
  {% endif %}
})();
</script>
{% endblock %}
