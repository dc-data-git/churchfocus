# Copy to config.yaml and edit. All paths are relative to this file.

input_dir: data/raw          # put corpus files here (see README: Input format)
work_dir: work               # all stage outputs, resumable
seed_terms: data/seed_terms.txt
generic_terms: data/generic_terms.txt
observables: data/observables.txt
features: data/features.yaml
schema: schemas/lexicon_entry.schema.json

llm:
  provider: ollama           # ollama | openai_compat
  base_url: http://localhost:11434
  api_key_env: ""            # env var holding a key, for openai_compat servers that need one
  chat_model: qwen2.5:14b    # 14B Q4 fits a 16 GB GPU; use qwen2.5:7b for speed
  small_chat_model: qwen2.5:7b   # used for high-volume, simple tasks (seeker extraction, stance)
  embed_model: nomic-embed-text
  temperature: 0
  timeout_s: 300
  max_retries: 3             # network retries
  json_repair_attempts: 2    # re-ask the model with the validation error (self-correction)
  num_ctx: 8192

privacy:
  scrub_handles: true        # @handles
  scrub_emails: true
  scrub_phones: true
  scrub_urls: true
  drop_fields: [author, username, user_id, handle, profile_url, name]
  context_window_tokens: 12  # KWIC contexts are truncated to +/- this many tokens
  retain_clean_docs: true    # set false to delete work/01_ingest/docs.jsonl after the run (aggregates only)

split:
  seeker_holdout_fraction: 0.2   # held out for the coverage eval; never used to build the lexicon

counts:
  max_ngram: 3
  min_count: 5               # minimum corpus count for a candidate term
  min_npmi: 0.25             # phrase cohesion threshold for bigrams/trigrams

keyness:
  reference_corpus_size: 10000000   # pseudo-size for the wordfreq English reference
  prior_strength: 500               # informative Dirichlet prior strength (Monroe et al. 2008)
  min_tradition_docs: 20            # tradition subcorpora smaller than this are skipped

seeker:
  use_llm: true              # LLM extracts requested attributes from request sentences; false = n-gram fallback
  max_requests: 5000         # cap on LLM extraction calls

shortlist:
  size: 300                  # terms that get the expensive analyses (embeddings, stance)
  max_ref_freq: 1.5e-4       # drop non-seed terms more common than this in general English
  subsume_ratio: 0.8         # drop a term if >= 80% of its uses are inside one longer phrase

contexts:
  per_term: 40               # sampled contexts per shortlisted term

polysemy:
  k_range: [2, 4]
  min_contexts: 12

stance:
  use_llm: true
  sample_per_term: 20

grounding:
  window: 10
  min_cooccurrence: 3
  top_k: 8

rank:
  weights: {seeker: 1.0, keyness: 0.6, ambiguity: 1.0, seed: 0.5}

draft:
  top_n: 150                 # terms drafted into lexicon entries
  contexts_in_prompt: 6

dimensions:
  n_clusters: 7

review:
  drift_threshold: 0.3       # polysemous terms drifting more than this across traditions go to tier A
  tier_b_size: 50            # next most-requested terms, one reviewer each
  audit_size: 20             # random sample of unreviewed terms, for an honest error estimate
  seed: 13

report:
  top_n_tables: 40
